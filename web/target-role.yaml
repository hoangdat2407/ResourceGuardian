AWSTemplateFormatVersion: '2010-09-09'
Description: Read only role created in the AWS account being scanned
Parameters:
  ApiPrincipal: {Type: String}
  ScanPrincipal: {Type: String}
  ExternalId: {Type: String, MinLength: 16}
  RoleSuffix: {Type: String, Default: demo, AllowedPattern: '[A-Za-z0-9-]{1,30}'}
Resources:
  ReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'GuardianReadRole-${RoleSuffix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: [!Ref ApiPrincipal, !Ref ScanPrincipal]
            Action: sts:AssumeRole
            Condition:
              StringEquals: {sts:ExternalId: !Ref ExternalId}
      Policies:
        - PolicyName: guardian-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeImages
                  - ec2:DescribeNatGateways
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeVpcEndpoints
                  - cloudwatch:GetMetricData
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshots
                  - elasticloadbalancing:DescribeLoadBalancers
                  - lambda:ListFunctions
                  - lambda:ListEventSourceMappings
                  - lambda:GetPolicy
                  - logs:DescribeLogGroups
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - ecr:DescribeRepositories
                  - ecr:GetLifecyclePolicy
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                  - elasticache:DescribeCacheClusters
                  - elasticfilesystem:DescribeFileSystems
                  - ecs:ListClusters
                  - ecs:DescribeClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - autoscaling:DescribeAutoScalingGroups
                  - apigateway:GET
                  - sns:ListTopics
                  - sns:GetTopicAttributes
                  - events:ListRules
                  - events:ListTargetsByRule
                  - states:ListStateMachines
                  - sagemaker:ListEndpoints
                  - sagemaker:DescribeEndpoint
                  - es:ListDomainNames
                  - es:DescribeDomains
                  - redshift:DescribeClusters
                  - kafka:ListClusters
                  - kinesis:ListStreams
                  - cloudfront:ListDistributions
                  - backup:ListBackupVaults
                  - backup:ListRecoveryPointsByBackupVault
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:ListNodegroups
                  - eks:ListFargateProfiles
                  - fsx:DescribeFileSystems
                  - memorydb:DescribeClusters
                  - rds:DescribeDBClusters
                Resource: '*'
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: '*'
              - Effect: Allow
                Action: s3:ListBucketMultipartUploads
                Resource: !Sub 'arn:${AWS::Partition}:s3:::*'
Outputs:
  RoleArn: {Value: !GetAtt ReadRole.Arn}
